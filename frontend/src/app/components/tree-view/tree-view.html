<div class="layout">
  <div class="tree-container">
    <div class="tree-header">
      <input
        type="text"
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearch($event)"
        placeholder="Search in tree..."
        class="search-input"
      />
      <div class="actions">
        @if (!(tree$ | async)) {
          <button (click)="openCreateDialog(null)" class="btn btn-primary">
            + New Root Node
          </button>
        }
      </div>
    </div>

    <div class="tree-body">
      @if (loading) {
        <div class="loading-state">
          <span class="spinner"></span>
          Loading tree...
        </div>
      } @else if (tree$ | async; as tree) {
        <app-tree-node
          [node]="tree"
          [selectedId]="selectedNode?.id ?? null"
          (nodeSelect)="onNodeSelect($event)"
          (nodeCreate)="openCreateDialog($event)"
          (nodeEdit)="openEditDialog($event)"
          (nodeDelete)="openDeleteConfirm($event)"
          (nodeDrop)="onNodeDrop($event)"
        />
      } @else {
        <div class="empty-state">
          <p>No tree yet. Create your first node!</p>
        </div>
      }
    </div>
  </div>

  <div class="content-area">
    @if (selectedNode) {
      <app-content-panel
        [node]="selectedNode"
        (addChild)="openCreateDialog($event)"
        (edit)="openEditDialog($event)"
        (delete)="openDeleteConfirm($event)"
      />
    } @else {
      <div class="no-selection">
        <div class="no-selection-icon">&#128196;</div>
        <p>Select a node to view its content</p>
      </div>
    }
  </div>
</div>

@if (showNodeDialog) {
  <app-node-dialog
    [mode]="dialogMode"
    [parentId]="dialogParentId"
    [node]="editingNode"
    (save)="onDialogSave($event)"
    (cancel)="onDialogCancel()"
  />
}

@if (showDeleteDialog && deletingNode) {
  <app-delete-confirm
    [node]="deletingNode"
    (confirm)="onDeleteConfirm()"
    (cancel)="onDeleteCancel()"
  />
}
