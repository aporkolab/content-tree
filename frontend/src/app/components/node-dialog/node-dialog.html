<div
  class="dialog-overlay"
  tabindex="-1"
  (click)="onOverlayClick($event)"
  (keydown.escape)="cancelled.emit()"
>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="node-dialog-title">
    <div class="dialog-header">
      <h3 id="node-dialog-title">{{ title() }}</h3>
      <button type="button" class="close-btn" aria-label="Close" (click)="cancelled.emit()">
        &times;
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Name</label>
        <input
          #nameInput
          id="name"
          type="text"
          formControlName="name"
          placeholder="Enter node name"
          [attr.maxlength]="nameMaxLength"
          [class.invalid]="showError('name')"
        />
        @if (showError('name')) {
          <span class="error">
            {{ form.controls.name.hasError('maxlength') ? 'Name is too long' : 'Name is required' }}
          </span>
        }
      </div>

      <div class="form-group">
        <label for="content">Content</label>
        <textarea
          id="content"
          formControlName="content"
          rows="4"
          placeholder="Enter node content"
          [attr.maxlength]="contentMaxLength"
          [class.invalid]="showError('content')"
        ></textarea>
        @if (showError('content')) {
          <span class="error">
            {{
              form.controls.content.hasError('maxlength')
                ? 'Content is too long'
                : 'Content is required'
            }}
          </span>
        }
      </div>

      <div class="dialog-actions">
        <button type="button" class="btn btn-secondary" (click)="cancelled.emit()">Cancel</button>
        <button type="submit" class="btn btn-primary">
          {{ mode() === 'create' ? 'Create' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
