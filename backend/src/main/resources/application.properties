spring.application.name=content-tree
server.port=8080

# JSON file the tree is persisted to (relative paths resolve against the working directory)
content-tree.data-file=${CONTENT_TREE_DATA_FILE:data/tree.json}
# comma separated list of origins allowed to call /api/**
content-tree.cors-allowed-origins=${CONTENT_TREE_CORS_ALLOWED_ORIGINS:http://localhost:4200}
